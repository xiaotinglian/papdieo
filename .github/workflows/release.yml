name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Ensure Cargo.lock exists
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          DIST="papdieo-${VERSION}-linux-${{ matrix.artifact_arch }}"
          mkdir -p "dist/${DIST}"
          cp "target/${{ matrix.target }}/release/papdieo" "dist/${DIST}/"
          cp LICENSE "dist/${DIST}/"
          cp README.md "dist/${DIST}/"
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          sha256sum "dist/${DIST}.tar.gz" > "dist/${DIST}.tar.gz.sha256"

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: papdieo-release-${{ matrix.artifact_arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: papdieo-release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  publish-aur-bin:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PKGBUILD
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          curl -sL "https://github.com/xiaotinglian/papdieo/releases/download/${TAG}/papdieo-${TAG}-linux-x86_64.tar.gz" -o papdieo-x86_64.tar.gz
          curl -sL "https://github.com/xiaotinglian/papdieo/releases/download/${TAG}/papdieo-${TAG}-linux-aarch64.tar.gz" -o papdieo-aarch64.tar.gz

          SHA256_X86_64=$(sha256sum papdieo-x86_64.tar.gz | cut -d' ' -f1)
          SHA256_AARCH64=$(sha256sum papdieo-aarch64.tar.gz | cut -d' ' -f1)

          sed -e "s/\${VERSION}/${VERSION}/g" \
              -e "s/\${SHA256_X86_64}/${SHA256_X86_64}/g" \
              -e "s/\${SHA256_AARCH64}/${SHA256_AARCH64}/g" \
              .github/aur-bin/PKGBUILD.template > PKGBUILD

      - name: Publish to AUR
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_PRIVATE_KEY_FALLBACK: ${{ secrets.AUR_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_FALLBACK: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_USERNAME:-}" ]; then
            echo "::error::AUR_USERNAME is not configured."
            exit 1
          fi

          if [ -z "${AUR_EMAIL:-}" ]; then
            echo "::error::AUR_EMAIL is not configured."
            exit 1
          fi

          if [ -n "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            SSH_KEY="${AUR_SSH_PRIVATE_KEY}"
          elif [ -n "${AUR_PRIVATE_KEY_FALLBACK:-}" ]; then
            SSH_KEY="${AUR_PRIVATE_KEY_FALLBACK}"
          elif [ -n "${SSH_PRIVATE_KEY_FALLBACK:-}" ]; then
            SSH_KEY="${SSH_PRIVATE_KEY_FALLBACK}"
          else
            echo "::error::No AUR SSH private key was found. Set AUR_SSH_PRIVATE_KEY (or AUR_PRIVATE_KEY/SSH_PRIVATE_KEY)."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/aur_id_ed25519"
          chmod 600 "$HOME/.ssh/aur_id_ed25519"
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/aur_id_ed25519"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -T aur@aur.archlinux.org </dev/null

          git clone "ssh://aur@aur.archlinux.org/papdieo-bin.git" "$RUNNER_TEMP/aur-repo"
          cp PKGBUILD "$RUNNER_TEMP/aur-repo/PKGBUILD"
          cd "$RUNNER_TEMP/aur-repo"
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD

          if git diff --cached --quiet; then
            echo "No changes detected; skipping AUR push."
            exit 0
          fi

          git commit -m "Update to ${{ github.ref_name }}"
          git push origin HEAD:master
